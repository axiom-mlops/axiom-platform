# QLoRA adapter config for the diagnostician.
# Not yet trained in this snapshot. Recorded here so the training run is
# reproducible rather than remembered.

base_model: Qwen/Qwen3.5-9B          # Apache 2.0, chosen so the weights can live inside the trust boundary
task: incident_root_cause_analysis

quantization:
  load_in_4bit: true
  bnb_4bit_quant_type: nf4
  bnb_4bit_compute_dtype: bfloat16
  bnb_4bit_use_double_quant: true

lora:
  r: 32
  alpha: 64
  dropout: 0.05
  target_modules: [q_proj, k_proj, v_proj, o_proj, gate_proj, up_proj, down_proj]
  # r=32 because the task is narrow. The model is not learning new knowledge,
  # it is learning an output discipline: closed cause vocabulary, cite or refuse,
  # schema-clean JSON first try. Higher rank mostly buys overfitting on a small set.

training:
  epochs: 3
  per_device_batch_size: 4
  gradient_accumulation_steps: 8
  learning_rate: 1.0e-4
  lr_scheduler: cosine
  warmup_ratio: 0.03
  max_seq_length: 4096
  bf16: true

data:
  train: finetune/data/train.jsonl
  eval: finetune/data/eval.jsonl
  holdout_policy: "Golden eval incidents are excluded from training. A model scored on its own training data is not scored."

hardware:
  target: single A100 80GB or 2x A10G, rented per run
  note: "Adapter is a few hundred MB. It ships as an artifact, the base model is pulled separately."

acceptance_gate:
  # The adapter does not ship unless it clears these against evals/datasets/golden_incidents.jsonl
  schema_valid_pct_min: 99.0
  action_policy_pass_pct_min: 100.0
  cause_top1_model_only_pct_min: 85.0
  latency_p90_ms_max: 1000
