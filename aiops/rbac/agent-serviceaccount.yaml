# Least-privilege identity for the RCA agent's executor.
#
# This file is the enforcement point behind the claim "the agent emits intent,
# the executor holds RBAC." The agent process authenticates as this
# ServiceAccount and can therefore do exactly what is listed below and nothing
# else -- enforced by the API server, not by a prompt or by application code.
#
# Deliberately absent: create, delete, exec, secrets, and any write to
# Deployments' pod spec. An agent that cannot delete a resource cannot delete a
# resource, regardless of what it is convinced to attempt.
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: aiops-rca-agent
  namespace: boutique
  labels:
    app.kubernetes.io/name: aiops-rca-agent
    app.kubernetes.io/part-of: axiom-aiops
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: aiops-rca-agent
  namespace: boutique
rules:
  # Read plane -- evidence gathering during diagnosis.
  - apiGroups: [""]
    resources: ["pods", "events"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["apps"]
    resources: ["deployments", "replicasets"]
    verbs: ["get", "list", "watch"]

  # Act plane -- the whitelisted action space, and only it.
  # patch_hpa_add_memory_target and scale_deployment both land here.
  - apiGroups: ["autoscaling"]
    resources: ["horizontalpodautoscalers"]
    verbs: ["get", "list", "watch", "patch", "update"]

  # rollback_deployment needs to read history and patch the rollout,
  # not to recreate the workload.
  - apiGroups: ["apps"]
    resources: ["deployments/scale"]
    verbs: ["patch", "update"]
  - apiGroups: ["apps"]
    resources: ["controllerrevisions"]
    verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: aiops-rca-agent
  namespace: boutique
subjects:
  - kind: ServiceAccount
    name: aiops-rca-agent
    namespace: boutique
roleRef:
  kind: Role
  name: aiops-rca-agent
  apiGroup: rbac.authorization.k8s.io
