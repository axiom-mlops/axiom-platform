name: "CI: manifest validation"

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  render-validate:
    name: kustomize + kubeconform (${{ matrix.cluster }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        cluster: [local-mac, azure-dev, aws-dev]
    steps:
      - uses: actions/checkout@v5
      - uses: azure/setup-kubectl@v4
        with:
          version: 'v1.29.3'
      - name: Install kubeconform
        run: |
          curl -sSL https://github.com/yannh/kubeconform/releases/latest/download/kubeconform-linux-amd64.tar.gz | tar xz
          sudo mv kubeconform /usr/local/bin/
      - name: Render and validate
        run: |
          kubectl kustomize "clusters/${{ matrix.cluster }}" > rendered.yaml
          kubeconform -strict -ignore-missing-schemas -summary rendered.yaml

  server-dry-run:
    name: kind server-side dry-run (local-mac)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: azure/setup-kubectl@v4
        with:
          version: 'v1.29.3'
      - uses: helm/kind-action@v1.10.0
        with:
          cluster_name: ci-validation
          node_image: kindest/node:v1.29.2
      - name: Create namespaces and priority classes
        run: kubectl apply -k platform/namespaces
      - name: Server-side dry-run of the full local-mac composition
        run: kubectl apply --dry-run=server -k clusters/local-mac

  lint-scripts:
    name: shellcheck
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - name: Install shellcheck
        run: sudo apt-get install -y shellcheck
      - name: Shellcheck (warnings block)
        run: find scripts reliability -name "*.sh" -print0 | xargs -0 shellcheck --severity=warning

  secret-scan:
    name: secret scan (gitleaks)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  yaml-lint:
    name: yamllint (non-blocking)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - run: pip install yamllint
      - run: yamllint -c .yamllint.yaml apps platform observability clusters || true

  ci-gate:
    name: CI Gate
    runs-on: ubuntu-24.04
    needs: [render-validate, server-dry-run, lint-scripts, secret-scan, yaml-lint]
    if: always()
    steps:
      - name: Require all blocking jobs
        run: |
          for r in "${{ needs.render-validate.result }}" "${{ needs.server-dry-run.result }}" \
                   "${{ needs.lint-scripts.result }}" "${{ needs.secret-scan.result }}"; do
            if [[ "$r" != "success" ]]; then echo "blocking job result: $r"; exit 1; fi
          done
          echo "All CI checks passed"
